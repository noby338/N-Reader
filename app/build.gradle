plugins {
    id 'com.android.application'
}

def targetAbi = project.findProperty("targetAbi")?.toString()

android {
    namespace 'com.noby.nreader'
    compileSdk 34

    defaultConfig {
        applicationId "com.noby.nreader"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0.0"
        ndk {
            if (targetAbi) {
                abiFilters targetAbi
            } else {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable "ExpiredTargetSdkVersion"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation files('libs/zxing-core-3.5.3.jar')
    implementation 'com.hierynomus:smbj:0.13.0'
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('deployToDownloads', Copy) {
    dependsOn 'assembleDebug'
    from layout.buildDirectory.dir("outputs/apk/debug")
    include 'app-debug.apk'
    rename { 'N-Reader.apk' }
    into "${System.getProperty('user.home')}/Downloads"
    doLast {
        println ">> [DEPLOY] Successfully copied N-Reader.apk to ${System.getProperty('user.home')}/Downloads/N-Reader.apk"
    }
}
